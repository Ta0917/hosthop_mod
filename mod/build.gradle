    mainClass = 'dev.hosthop.snapshot.SnapshotVerifierTest'
    args '--create', file('../test-data/dqm-copy').absolutePath, file('../.tools/snapshot-java-created.zip').absolutePath
}
// Optional integration check requires the local Miniflare tools installed under .tools.
tasks.register('buildLeaseService', Exec) {
    commandLine 'node', file('../service/build.mjs').absolutePath
}
if (project.hasProperty('hosthopHostSmoke')) tasks.named('runClient') { dependsOn tasks.named('buildLeaseService') }
tasks.register('leaseServiceIntegrationProbe', JavaExec) {
    dependsOn tasks.named('safetyTestClasses'), tasks.named('buildLeaseService')
    classpath = sourceSets.safetyTest.runtimeClasspath
    mainClass = 'dev.hosthop.lease.LeaseServiceIntegrationProbe'
    systemProperty 'hosthop.bridge', file('../poc/d1/local_https_bridge.mjs').absolutePath
    systemProperty 'hosthop.miniflare', file('../.tools/d1-tool/node_modules/miniflare').absolutePath
}
